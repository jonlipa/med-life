{% extends "layouts/base.html" %}

{% block body_class %}doctor-layout{% endblock %}

{% block sidebar_nav %}
<div class="nav-group">
    <div class="nav-group-title">Mjekësia</div>
    <ul class="nav-list">
        <li class="nav-item">
            <a href="{{ url_for('doctor.dashboard') }}" class="nav-link {% if request.endpoint == 'doctor.dashboard' %}active{% endif %}">
                <span class="nav-icon">🏥</span>
                <span class="nav-text">Paneli Kryesor</span>
            </a>
        </li>
    </ul>
</div>

<div class="nav-group">
    <div class="nav-group-title">Pacientët e Mi</div>
    <ul class="nav-list">
        <li class="nav-item">
            <a href="{{ url_for('doctor.patients') }}" class="nav-link {% if request.endpoint == 'doctor.patients' %}active{% endif %}">
                <span class="nav-icon">👨‍👩‍👧‍👦</span>
                <span class="nav-text">Lista e Pacientëve</span>
            </a>
        </li>
    </ul>
</div>

<div class="nav-group">
    <div class="nav-group-title">Programimet</div>
    <ul class="nav-list">
        <li class="nav-item">
            <a href="{{ url_for('doctor.appointments') }}" class="nav-link {% if request.endpoint == 'doctor.appointments' %}active{% endif %}">
                <span class="nav-icon">📅</span>
                <span class="nav-text">Të Gjitha Programimet</span>
            </a>
        </li>
    </ul>
</div>
{% endblock %}
